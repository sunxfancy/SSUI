name: ImageExtension
version: 0.1.0
server:
  venv: shared
  dependencies:
    - numpy>=1.21.2
    - diffusers==0.42.1
    - transformers==5.1.0
    - accelerate>=1.2.1
  packages:
    - ssui_image
  main: extension.py

web_ui:
  dist: dist/
  mount: canvas/
  file_opener:
    - Canvas: /canvas/?path=(*.canvas)
