name: Build native Intel macOS PyTorch
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/macos-intel-wheels.yml'
      - 'scripts/build_macos_intel_wheels.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-intel-wheels-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Look for a verified build of this exact recipe
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/find_native_wheels.py
      - name: Install pinned standalone Python
        run: node dependencies/bootstrap.cjs --github-env
      - name: Install native build prerequisites
        if: steps.reuse.outputs.reused != 'true'
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1 cmake==3.31.6 ninja==1.11.1.4 numpy==1.26.4 pyyaml==6.0.2 typing-extensions==4.15.0 sympy==1.14.0 networkx==3.5 jinja2==3.1.6 fsspec==2025.9.0 filelock==3.19.1 pillow==11.3.0 delocate==0.13.0
          brew install libjpeg-turbo libpng
      - name: Build pinned native CPU wheels
        if: steps.reuse.outputs.reused != 'true'
        run: python scripts/build_macos_intel_wheels.py
      - name: Verify source wheel manifest
        run: node dependencies/native_wheels.cjs native-wheels
      - name: Verify portable native libraries
        run: python scripts/verify_macos_wheels.py
      - name: Resolve the Intel dependency lock with the native wheels
        run: |
          cp dependencies/macosx-x86_64.lock native-wheels/macosx-x86_64.lock
          uv pip compile dependencies/requirements-macosx-x86_64.txt --find-links native-wheels --python-version 3.12.8 --python-platform x86_64-apple-darwin --index-strategy unsafe-best-match --emit-index-url -o native-wheels/macosx-x86_64.lock
      - name: Preserve native wheels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-intel-wheels
          path: native-wheels/
          if-no-files-found: warn
          retention-days: 30
