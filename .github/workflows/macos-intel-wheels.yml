name: Build native Intel macOS PyTorch
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: ['codex/windows-arm64-release']
    paths:
      - '.github/workflows/macos-intel-wheels.yml'
      - 'scripts/build_macos_intel_wheels.py'
permissions:
  contents: read
concurrency:
  group: macos-intel-wheels-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install pinned standalone Python
        run: node dependencies/bootstrap.cjs --github-env
      - name: Install native build prerequisites
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1 cmake==3.31.6 ninja==1.11.1.4 numpy==1.26.4 pyyaml==6.0.2 typing-extensions==4.15.0 sympy==1.14.0 networkx==3.5 jinja2==3.1.6 fsspec==2025.9.0 filelock==3.19.1 pillow==11.3.0 delocate==0.13.0
          brew install libjpeg-turbo libpng
      - name: Build pinned native CPU wheels
        run: python scripts/build_macos_intel_wheels.py
      - name: Preserve native wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-intel-wheels
          path: native-wheels/
          if-no-files-found: error
          retention-days: 30
