# Six native desktop targets. Tagged versions must already be prepared in a PR.
# This workflow publishes candidates only; release-promote.yml formalizes them.
name: Release

on:
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: Pre-release tag ([v]MAJOR.MINOR.PATCH)
        required: true
        type: string

env:
  SSUI_CI_SKIP_INSTALL: 1
  # torch 等 wheel 体积大，调大 HTTP 超时避免大文件下载偶发失败
  UV_HTTP_TIMEOUT: 600

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  start:
    permissions:
      contents: write
    name: start (version + branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.go.outputs.tag }}
      branch: ${{ steps.go.outputs.branch }}
      sha: ${{ steps.go.outputs.sha }}
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start release
        timeout-minutes: 10
        id: go
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: "true"
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py start --tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=v${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  strict-tests:
    name: Strict tests
    needs: start
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.start.outputs.sha }}
    secrets: inherit

  native-wheels:
    needs: start
    uses: ./.github/workflows/windows-arm64-wheels.yml
    with:
      ref: ${{ needs.start.outputs.sha }}

  package:
    name: Package ${{ matrix.id }}
    needs: [start, strict-tests, native-wheels]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            id: windows-x86_64
            bundles: nsis
            binary: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/ssui.exe
          - os: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            id: windows-arm64
            bundles: nsis
            binary: desktop/src-tauri/target/aarch64-pc-windows-msvc/release/ssui.exe
          - os: macos-15-intel
            platform: macosx
            arch: x86_64
            target: x86_64-apple-darwin
            id: macos-x86_64
            bundles: dmg
            binary: desktop/src-tauri/target/x86_64-apple-darwin/release/ssui
          - os: macos-15
            platform: macosx
            arch: arm64
            target: aarch64-apple-darwin
            id: macos-arm64
            bundles: dmg
            binary: desktop/src-tauri/target/aarch64-apple-darwin/release/ssui
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            id: linux-x86_64
            bundles: deb
            binary: desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/ssui
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            id: linux-arm64
            bundles: deb
            binary: desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/ssui

    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.start.outputs.sha }}

      - name: Check native runtime prerequisites
        shell: bash
        run: >-
          python scripts/release_preflight.py --target '${{ matrix.id }}'


      - name: Set Node.js 22.x
        timeout-minutes: 5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        timeout-minutes: 20
        run: yarn install --frozen-lockfile

      - name: Select shared runtime
        id: runtime
        run: node dependencies/runtime.cjs --github-output

      - name: Install pinned standalone Python
        timeout-minutes: 15
        run: node dependencies/bootstrap.cjs --github-env

      - name: Install packaging
        timeout-minutes: 5
        run: uv pip install packaging==24.1

      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev pkg-config xvfb libgl1-mesa-dev libx11-dev

      - name: Install requirements
        timeout-minutes: 30
        shell: bash
        run: |
          if [ '${{ matrix.id }}' = windows-arm64 ]; then
            uv pip install --no-build -r dependencies/${{ steps.runtime.outputs.lock }} --index-strategy unsafe-best-match
          else
            uv pip install -r dependencies/${{ steps.runtime.outputs.lock }} --index-strategy unsafe-best-match --build-constraint dependencies/build-constraints.txt
          fi

      - name: Verify native Python and inference libraries
        run: python scripts/check_runtime.py --target ${{ matrix.id }}

      - name: Setup Rust
        timeout-minutes: 10
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          target: ${{ matrix.target }}
          # Run caching explicitly so its hit status is available to the summary.
          cache: "false"

      - name: Install Canvas WASM build tools
        timeout-minutes: 15
        run: yarn workspace @ssui/canvas-engine setup

      - name: Restore Rust compilation cache
        id: rust-cache
        timeout-minutes: 10
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "desktop/src-tauri -> target"
          shared-key: "tauri-release-${{ matrix.id }}"
          cache-on-failure: "true"

      - name: Report Rust cache status
        if: always()
        timeout-minutes: 5
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          CACHE_OUTCOME: ${{ steps.rust-cache.outcome }}
          CACHE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$CACHE_OUTCOME" != "success" ]; then
            status="Cache step did not complete successfully ($CACHE_OUTCOME)"
          elif [ "$CACHE_HIT" = "true" ]; then
            status="Exact cache hit"
          else
            status="No exact hit; see cache step logs for fallback restore or cache miss"
          fi
          {
            echo "### Rust compilation cache ($CACHE_PLATFORM)"
            echo "$status"
            echo
            echo 'Caches Cargo dependencies and their compiled artifacts in desktop/src-tauri/target.'
            echo 'rust-cache reports exact cache hits, not a per-crate compilation hit percentage.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build ssext tools
        timeout-minutes: 20
        run: yarn build:extension_builder && cd extension_builder && npm link

      - name: Build Debug desktop and run native tests
        timeout-minutes: 60
        run: |
          yarn build:frontend
          yarn build:desktop:debug --target ${{ matrix.target }} --no-bundle
          yarn test

      - name: Pack desktop
        timeout-minutes: 90
        run: yarn package --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Smoke test app executable
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/smoke_app.cjs '${{ matrix.binary }}'
          else
            node scripts/smoke_app.cjs '${{ matrix.binary }}'
          fi

      - name: Collect verified installer
        shell: bash
        env:
          TAG: ${{ needs.start.outputs.tag }}
          SOURCE_SHA: ${{ needs.start.outputs.sha }}
        run: >-
          python scripts/release_assets.py collect --directory release-assets
          --tag "$TAG" --sha "$SOURCE_SHA" --target '${{ matrix.id }}'
          --binary '${{ matrix.binary }}'
          --bundle 'desktop/src-tauri/target/${{ matrix.target }}/release/bundle'

      - name: Save verified assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  consumer:
    name: Install downloaded ${{ matrix.id }}
    needs: [start, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            id: windows-x86_64
            bundles: nsis
            binary: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/ssui.exe
          - os: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            id: windows-arm64
            bundles: nsis
            binary: desktop/src-tauri/target/aarch64-pc-windows-msvc/release/ssui.exe
          - os: macos-15-intel
            platform: macosx
            arch: x86_64
            target: x86_64-apple-darwin
            id: macos-x86_64
            bundles: dmg
            binary: desktop/src-tauri/target/x86_64-apple-darwin/release/ssui
          - os: macos-15
            platform: macosx
            arch: arm64
            target: aarch64-apple-darwin
            id: macos-arm64
            bundles: dmg
            binary: desktop/src-tauri/target/aarch64-apple-darwin/release/ssui
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            id: linux-x86_64
            bundles: deb
            binary: desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/ssui
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            id: linux-arm64
            bundles: deb
            binary: desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/ssui

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.start.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ matrix.id }}
          path: candidate
      - name: Check downloaded checksum
        shell: bash
        run: |
          python -c 'import json, pathlib, sys; sys.path.insert(0, "scripts"); from release_assets import digest; p=pathlib.Path("candidate"); r=json.loads(next(p.glob("*.json")).read_text()); assert digest(p/r["name"]) == r["sha256"]'
      - name: Prepare Linux display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Smoke test installed app (NSIS)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $installer = Get-ChildItem "candidate/*.exe" |
            Select-Object -First 1
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($proc.ExitCode)"
          }
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA -Filter 'ssui.exe' -Recurse `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            throw 'installed ssui.exe not found under LOCALAPPDATA after silent install'
          }
          node scripts/smoke_app.cjs $exe.FullName

      - name: Smoke test installed app (DMG)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          DMG="$(ls candidate/*.dmg | head -1)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/ssui-dmg
          trap 'hdiutil detach /tmp/ssui-dmg >/dev/null 2>&1 || true' EXIT
          APP="$(find /tmp/ssui-dmg -maxdepth 2 -name '*.app' | head -1)"
          test -n "$APP" || { echo "error: no .app found in DMG" >&2; exit 1; }
          ditto "$APP" /tmp/ssui-installed.app
          BIN="$(find /tmp/ssui-installed.app/Contents/MacOS -maxdepth 1 -type f | head -1)"
          test -n "$BIN" || { echo "error: no executable found in $APP" >&2; exit 1; }
          node scripts/smoke_app.cjs "$BIN"

      - name: Smoke test installed app (DEB)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./candidate/*.deb
          xvfb-run -a node scripts/smoke_app.cjs /usr/bin/ssui


  finish:
    permissions:
      contents: write
      pull-requests: write
      checks: write
    name: Verify all six targets and open release PRs
    needs: [start, package, consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.start.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify manifest and upload candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.start.outputs.tag }}
          SOURCE_SHA: ${{ needs.start.outputs.sha }}
        run: |
          python3 scripts/release_assets.py verify --directory release-assets --tag "$TAG" --sha "$SOURCE_SHA"
          python3 scripts/upload_release_assets.py "$TAG" release-assets

      - name: Finish release
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: "true"
          TAG: ${{ needs.start.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py finish --tag "$TAG"
