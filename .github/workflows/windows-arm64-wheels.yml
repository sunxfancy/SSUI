# Source-built packages are published by sunxfancy/ssui-python-packages and pinned
# in dependencies.yaml. Validate that exact set before a desktop release.
name: Windows ARM64 native dependencies
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: ['codex/windows-arm64-release']
    paths:
      - 'dependencies/**'
      - 'scripts/*arm64*'
      - 'scripts/audit_native_binaries.py'
      - 'scripts/runtime_config.py'
      - 'scripts/check_runtime.py'
      - '.github/workflows/windows-arm64-wheels.yml'
permissions:
  contents: read
concurrency:
  group: windows-arm64-wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  verify:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Select runtime
        id: runtime
        run: node dependencies/runtime.cjs --github-output
      - name: Install pinned standalone Python
        timeout-minutes: 15
        run: node dependencies/bootstrap.cjs --github-env
      - name: Install the full native dependency lock
        timeout-minutes: 30
        run: |
          uv pip sync --no-build --index-strategy unsafe-best-match dependencies/${{ steps.runtime.outputs.lock }}
          uv pip check
      - name: Verify Python and native inference kernels
        run: python scripts/check_runtime.py --target windows-arm64
      - name: Audit installed native libraries
        run: python scripts/audit_native_binaries.py --output reports/native-binaries.json
      - name: Exercise audio, video, 3D and image dependencies
        timeout-minutes: 30
        run: python dependencies/probe_arm64.py --download-assets --assets-root "${{ runner.temp }}/probe-assets" --output reports/runtime-probe.json
      - name: Audit wheel availability and tags
        timeout-minutes: 15
        run: python dependencies/audit_wheels.py dependencies/windows-arm64-cpu.lock --python-version ${{ steps.runtime.outputs.python }} --strict --output reports/wheel-audit.json
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-verification
          path: reports/
          if-no-files-found: warn
          retention-days: 30
