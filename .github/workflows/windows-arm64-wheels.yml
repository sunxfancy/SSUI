name: Windows ARM64 native dependencies
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: ['codex/windows-arm64-release']
    paths:
      - 'dependencies/**'
      - 'scripts/*arm64*'
      - 'scripts/check_runtime.py'
      - '.github/workflows/windows-arm64-wheels.yml'
permissions:
  contents: read
concurrency:
  group: windows-arm64-wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Select runtime
        id: runtime
        run: node dependencies/runtime.cjs --github-output
      - name: Install pinned standalone Python
        timeout-minutes: 15
        run: node dependencies/bootstrap.cjs --github-env

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-pc-windows-msvc
          rustflags: ''
      - name: Compile and verify native wheels
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio installation not found' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'
          python scripts/build_windows_arm64_wheels.py --work "$env:RUNNER_TEMP/arm64-build" --output native-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload validated wheelhouse
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-wheels
          path: native-wheels/
          if-no-files-found: error
          retention-days: 30
