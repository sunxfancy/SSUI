# Python dependency source of truth. requirements-*.txt are generated.
# Merge order: common -> os -> arch -> backend -> ordered overrides.
# A null package removes it; a string/array replaces earlier constraints.
# Legacy ROCm inputs include Windows/CUDA wheels even on Linux; preserved here
# for migration parity, not a claim of compatibility. See doc/RuntimeTargets.md.
version: 1
common:
  packages:
    accelerate: ">=1.2.1"
    aiohttp: ">=3.11.11"
    aioshutil: ">=1.5"
    blake3: ">=1.0.4"
    clip-anytorch: ">=2.6.0"
    compel: ">=2.0.3"
    controlnet-aux: ">=0.0.7"
    deprecated: ">=1.2.18"
    diffusers[torch]: ">=0.37.0,<0.41"
    easydict: ">=1.13"
    einops: ">=0.8.0"
    fastapi[standard]: ">=0.115.6"
    gguf: ">=0.14.0"
    huggingface_hub[hf-transfer,hf_xet]: ">=0.31"
    igraph: ">=0.11.8"
    kornia: ">=0.8.0"
    matplotlib: ">=3.10.1"
    mediapipe: ">=0.10.21"
    moderngl: ">=5.12.0"
    onnx: ">=1.17.0"
    onnxruntime: ">=1.21.0"
    peft: "==0.17.1"
    picklescan: ">=0.0.24"
    pillow: ">=11.0.0"
    plyfile: ">=1.1"
    pydantic: ">=2.10.4"
    pydantic-settings: ">=2.7.0"
    pymeshfix: ">=0.17.0"
    pyvista: ">=0.44.2"
    pyyaml: ">=6.0.2"
    rembg: ">=2.0.65"
    RestrictedPython: ">=8.0"
    safetensors: ">=0.4.5"
    scipy: ">=1.15.2"
    spandrel: ">=0.4.1"
    tokenizers: ">=0.20.0"
    torchsde: "==0.2.6"
    transformers: ">=4.51.3,<5"
    trimesh: ">=4.6.5"
    virtualenv: ">=20.28.0"
    websockets: ">=14.1"
os:
  windows:
    packages:
      WeTextProcessing: "@ https://github.com/sunxfancy/pynini-2.1.6.post1/releases/download/2.1.6.post1/WeTextProcessing-1.0.4-py3-none-any.whl"
      conformer: ">=0.3.2"
      ftfy: ">=6.3"
      gguf: ">=0.10.0"
      huggingface_hub[hf-transfer,hf_xet]: ">=0.36.2,<1"
      hydra-core: "==1.3.2"
      imageio[ffmpeg]: ">=2.37.0"
      librosa: "==0.11.0"
      modelscope: "==1.26.0"
      networkx: "==3.3"
      openai-whisper: "==20240930"
      opencv-python-headless: ">=4.11.0.86"
      pyarrow: ">=20.0.0"
      pyworld: "==0.3.4"
      scipy:
        - ">=1.15.2"
        - ">=1.15"
      sentencepiece: "==0.2.0"
      soundfile: "==0.12.1"
      timm: ">=1.0.15"
      transformers: ">=4.54,<4.56"
  linux:
    packages:
      diffsynth: ">=1.1.7"
  macos:
    packages:
      modelscope: "==1.26.0"
      imageio[ffmpeg]: ">=2.37.0"
      sentencepiece: "==0.2.0"
      ftfy: ">=6.3"
      pandas: ">=2.2.3"
      omegaconf: "==2.3.0"
      scikit-image: ">=0.25.2"
arch:
  x64:
    packages:
      xatlas: ">=0.0.9"
  arm64: {}
backend:
  cpu:
    packages:
      torch: ">=2.7,<3"
      torchvision: ">=0.22,<1"
      torchaudio: ">=2.7,<3"
    extraIndexes:
      - https://download.pytorch.org/whl/cpu
  rocm: {}
  cuda:
    packages:
      torch: "==2.4.1+cu124"
      torchaudio: "==2.4.1+cu124"
      torchvision: "==0.19.1+cu124"
      xformers: "==0.0.28.post1"
    extraIndexes:
      - https://download.pytorch.org/whl/cu124
  mps:
    packages:
      torch: "==2.4.1"
      torchaudio: "==2.4.1"
      torchvision: "==0.19.1"
overrides:
  - when:
      os: windows
      arch: x64
      backend: rocm
    packages:
      accelerate: "==1.5.2"
      bitsandbytes: "@ https://github.com/sunxfancy/ssui-python-packages/releases/download/bitsandbytes-0.49.2-r1--windows-x64-cp312-rocm721-gfx1201--1205112e0195fdacf32a/bitsandbytes-0.49.2%2Bssui.rocm.721.291.gfx1201.r1.b1205112e0195-py3-none-win_amd64.whl"
      cumesh: "@ https://github.com/sunxfancy/SSUI/releases/download/rocm-wheels-20261027/cumesh-0.0.1%2Bssui.rocm72-cp312-cp312-win_amd64.whl#sha256=b8a4a82e82b39cb7d3396e8909f186fe7720163eb2ca7cfdd9dc9c03e5947544"
      nvdiffrast: "@ https://github.com/sunxfancy/SSUI/releases/download/rocm-wheels-20261027/nvdiffrast-0.4.0%2Bssui.rocm72-cp312-cp312-win_amd64.whl#sha256=5ead6ef29217d88d20a24cacacf05da66f810edc0b03b9567c08f1f30e8613db"
      natten: "@ https://github.com/sunxfancy/SSUI/releases/download/rocm-wheels-20261027/natten-0.17.4%2Bssui.rocm72-cp312-cp312-win_amd64.whl#sha256=96698e957dcde7c963b46f7e8512526055313dd75ab55e3b1288b9a00c667d23"
      flex-gemm: "@ https://github.com/sunxfancy/FlexGEMM.rocm72/releases/download/v1.0.0%2Brocm72/flex_gemm-1.0.0%2Brocm72-cp312-cp312-win_amd64.whl"
      o-voxel: "@ https://github.com/sunxfancy/o-voxel.rocm72/releases/download/v0.0.1%2Brocm72/o_voxel-0.0.1%2Brocm72-cp312-cp312-win_amd64.whl"
      safetensors: ">=0.8.0,<0.9"
      # DINOv3 needs newer Transformers; 4.55 also imports unavailable
      # torch.distributed.tensor on the Windows ROCm build.
      transformers: "==4.57.6"
      tokenizers: "==0.22.2"
  - when:
      os: windows
      arch: x64
      backend: cuda
    packages:
      nvdiffrast: "@ https://github.com/sunxfancy/nvdiffrast/releases/download/v0.3.3.1/nvdiffrast-0.3.3.1-cp312-cp312-win_amd64.whl"
      bitsandbytes: ">=0.45.3"
      cupy-cuda12x: ">=13.4"
  - when:
      os: windows
      arch: x64
      backend:
        - cuda
        - rocm
    packages:
      diff-gaussian-rasterization: "@ https://github.com/sunxfancy/diff-gaussian-rasterization/releases/download/v0.1/diff_gaussian_rasterization-0.0.0-cp312-cp312-win_amd64.whl"
      kaolin: "@ https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.4.0_cu124/kaolin-0.17.0-cp312-cp312-win_amd64.whl"
      pynini: "@ https://github.com/sunxfancy/pynini-2.1.6.post1/releases/download/2.1.6.post1/pynini-2.1.6.post1-cp312-cp312-win_amd64.whl"
      spconv-cu124: ">=2.3.8"
      torch-scatter: "@ https://data.pyg.org/whl/torch-2.4.0%2Bcu124/torch_scatter-2.1.2%2Bpt24cu124-cp312-cp312-win_amd64.whl"
      triton-windows: "==3.1.0.post17"
  - when:
      os:
        - windows
        - linux
      arch: x64
      backend: rocm
    packages:
      rocm_sdk_core: "@ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_core-7.2.1-py3-none-win_amd64.whl"
      rocm_sdk_devel: "@ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_devel-7.2.1-py3-none-win_amd64.whl"
      rocm_sdk_libraries_custom: "@ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_libraries_custom-7.2.1-py3-none-win_amd64.whl"
      torch: "@ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torch-2.9.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl"
      torchaudio: "@ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torchaudio-2.9.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl"
      torchvision: "@ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torchvision-0.24.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl"
      rocm: "@ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm-7.2.1.tar.gz"
  - when:
      os:
        - windows
        - macos
    packages:
      tiktoken: ">=0.9.0"
      transformers_stream_generator: "==0.0.4"
  - when:
      os: windows
      arch: x64
      backend: rocm
    extraIndexes:
      - https://download.pytorch.org/whl/cu124
  # Experimental CPU target: official PyTorch pair plus immutable SSUI wheels.
  - when:
      os: windows
      arch: arm64
      backend: cpu
    packages:
      torch: "==2.9.1+cpu"
      torchvision: "==0.24.1+d801a34"
      torchaudio: "==2.9.1+ssui.cpu.291.r1.ba7c51896a4b0"
      # Transformers 4.54/4.55 requires tokenizers<0.22 (no ARM64 wheels).
      transformers: "==4.57.6"
      tokenizers: "==0.22.2"
      huggingface_hub[hf-transfer,hf_xet]: ">=0.36.2,<1"
      hf-transfer: "==0.1.9+ssui.cpu.r1.b0a21e114de54"
      imageio[ffmpeg]: ">=2.37.0"
      imageio-ffmpeg: "==0.6.0+ssui.cpu.r2.b06fa0f77c82a"
      sentencepiece: "==0.2.2"
      # 0.12.1's universal wheel lacks libsndfile.dll on native Windows ARM64.
      soundfile: "==0.14.0"
      # Exact local versions identify published, independently verified builds.
      glcontext: "==3.0.0+ssui.cpu.r1.bf1816f253e6a"
      moderngl: "==5.12.0+ssui.cpu.r1.be987004179e0"
      opencv-python-headless: "==4.11.0.86+ssui.cpu.r1.b05e8c6d74ea4"
      pyarrow: "==20.0.0+ssui.cpu.r1.b9bfc03949403"
      pymeshfix: "==0.17.1+ssui.cpu.r1.b9816cfcfdc6b"
      vtk: "==9.4.2+ssui.cpu.r1.b62943278488d"
      pyvista: "==0.46.3"
      pyworld: "==0.3.4+ssui.cpu.r1.b83bf5208b453"
      # pyworld 0.3.4 imports pkg_resources, removed by setuptools 81+.
      setuptools: "==80.9.0"
      tiktoken: "==0.9.0+ssui.cpu.r1.bb0e785dac3f7"
      soxr: "==0.5.0.post1+ssui.cpu.r1.b9f0b72cc0d95"
      pynini: "==2.1.6.post1+ssui.cpu.r1.b9c91f73d4a44"
      WeTextProcessing: "==1.0.4+ssui.cpu.import1.be4d2d5c7bc86"
      antlr4-python3-runtime: "==4.9.3+ssui.cpu.r1.b0faf253a9595"
      # Adapter delegates streaming to the selected Transformers public API.
      transformers_stream_generator: "==0.0.4+ssui.cpu.r2.b410865ecf176"
      # Newer official ARM64 wheels replace the formerly blocked LLVM/JIT pair.
      numba: "==0.68.0"
      llvmlite: "==0.50.0"
      openai-whisper: "==20240930+ssui.cpu.r1.b7b7485ae8627"
      # Official ARM64 DLLs, with a dependency fix to share this headless cv2.
      mediapipe: "==1.1.1+ssui.cpu.r1.b45e54946cee2"
      controlnet-aux: "==0.0.10+ssui.cpu.r1.b7286b30fa4bc"
    extraIndexes:
      - https://sunxfancy.github.io/ssui-python-packages/simple/windows/arm64/cpu/
      - https://sunxfancy.github.io/ssui-python-packages/simple/windows/arm64/cpu/2.9.1/

  - when:
      os: linux
      arch: arm64
      backend: cpu
    packages:
      torch: '==2.8.0'
      torchvision: '==0.23.0'
      torchaudio: '==2.8.0'
  - when:
      os: macos
      arch: x64
      backend: cpu
    packages:
      torch: '==2.2.2'
      torchvision: '==0.17.2'
      torchaudio: '==2.2.2'
      numpy: <2
