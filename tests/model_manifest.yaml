# 真模型回归清单（可选门禁，默认不跑）
#
# 每个条目记录固定的 Hugging Face 仓库与文件；下载脚本写入 $TEST_DATA_DIR
# （默认 ~/.ssui_test_data）。sha256 留空时下载脚本会跳过校验，请在确认
# 文件后补全。snapshot: true 表示整个仓库快照（如 LLM / TTS 目录型模型）。

sd1:
  repo: "stable-diffusion-v1-5/stable-diffusion-v1-5"
  file: "v1-5-pruned-emaonly.safetensors"
  revision: "main"
  size_gb: 4.0
  sha256: ""

sdxl:
  repo: "stabilityai/stable-diffusion-xl-base-1.0"
  file: "sd_xl_base_1.0.safetensors"
  revision: "main"
  size_gb: 6.9
  sha256: ""

flux:
  transformer:
    repo: "InvokeAI/flux_schnell"
    file: "transformer/bnb_nf4/flux1-schnell-bnb_nf4.safetensors"
    revision: "main"
    size_gb: 10.0
    sha256: ""
  t5_encoder:
    repo: "InvokeAI/t5-v1_1-xxl"
    file: "bnb_llm_int8/text_encoder_2/bnb_llm_int8_model.safetensors"
    extra_files:
      - "bnb_llm_int8/text_encoder_2/config.json"
      - "bnb_llm_int8/tokenizer_2/special_tokens_map.json"
      - "bnb_llm_int8/tokenizer_2/spiece.model"
      - "bnb_llm_int8/tokenizer_2/tokenizer.json"
      - "bnb_llm_int8/tokenizer_2/tokenizer_config.json"
    return_dir: "bnb_llm_int8"
    revision: "main"
    size_gb: 3.0
    sha256: ""
  clip:
    repo: "InvokeAI/clip-vit-large-patch14-text-encoder"
    file: "bfloat16/text_encoder/model.safetensors"
    extra_files:
      - "bfloat16/text_encoder/config.json"
      - "bfloat16/tokenizer/merges.txt"
      - "bfloat16/tokenizer/special_tokens_map.json"
      - "bfloat16/tokenizer/tokenizer_config.json"
      - "bfloat16/tokenizer/vocab.json"
    return_dir: "bfloat16"
    revision: "main"
    size_gb: 0.3
    sha256: ""
  vae:
    repo: "auroraintech/flux-vae"
    file: "ae.safetensors"
    revision: "main"
    size_gb: 0.3
    sha256: ""

cosyvoice:
  repo: "iic/CosyVoice2-0.5B"
  snapshot: true
  revision: "main"
  size_gb: 1.0
  sha256: ""

llm:
  repo: "Qwen/Qwen-7B-Chat"
  snapshot: true
  revision: "main"
  size_gb: 15.0
  sha256: ""

trellis:
  repo: "jetx/trellis-image-large"
  snapshot: true
  revision: "main"
  size_gb: 10.0
  sha256: ""

diffsynth:
  sd1:
    repo: "Lykon/dreamshaper-8"
    file: "dreamshaper_8.safetensors"
    revision: "main"
    size_gb: 2.0
    sha256: ""
  animatediff:
    repo: "guoyww/animatediff"
    file: "mm_sd_v15_v2.ckpt"
    revision: "main"
    size_gb: 1.7
    sha256: ""

stdgen:
  canonicalize:
    local: "StdGEN/StdGEN-canonicalize-1024"
    note: "上游模型位置待确认，请手动放入 TEST_DATA_DIR"
  multiview:
    local: "StdGEN/StdGEN-multiview-1024"
    note: "上游模型位置待确认，请手动放入 TEST_DATA_DIR"
