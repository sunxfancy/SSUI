[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssui"
version = "0.1.0"
description = "Stable Scripts UI"
requires-python = ">=3.12,<3.13"
dependencies = ["packaging>=24", "pyyaml>=6", "pillow>=11", "soundfile>=0.12.1"]

[project.optional-dependencies]
inference = ["torch==2.9.1", "torchvision==0.24.1", "torchaudio==2.9.1", "transformers==5.1.0", "diffusers==0.42.1", "accelerate>=1.2.1,<2"]
video = ["ltx-pipelines==1.0.0", "diffsynth==2.2.0", "modelscope==1.26.0", "av>=16.1", "sentencepiece>=0.2"]
motion-generation = ["kimodo @ git+https://github.com/nv-tlabs/kimodo.git@1aece8c124d73d255ceff5086d983b844c9f4e94"]
voice = ["hyperpyyaml>=1.2", "inflect>=7", "conformer>=0.3.2", "hydra-core==1.3.2", "librosa>=0.11", "soundfile>=0.12.1", "openai-whisper==20240930", "pyworld>=0.3.4", "WeTextProcessing>=1.0.4"]
h3-int8 = ["torchao==0.14.1"]

[tool.setuptools]
license-files = ["LICENSE", "dependencies/ThirdPartyLicense/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ssui*", "server*", "ss_executor*", "backend*"]
exclude = ["tests*", "extensions*", "frontend*", "desktop*", "doc*", "examples*", "dependencies*", "configs*"]

[tool.setuptools.package-data]
"backend.plugins" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
