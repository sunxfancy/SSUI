[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssui"
version = "0.1.0"
description = "Stable Scripts UI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2", "httpx>=0.27,<1"]

[tool.setuptools]
py-modules = ["flow_compiler"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ssui*", "server*", "ss_executor*", "backend*"]
exclude = ["tests*", "extensions*", "frontend*", "desktop*", "doc*", "examples*", "dependencies*", "configs*"]
